<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequently asked — Anggie Putra Dimasta</title>
<meta name="description" content="Staff Software Engineer in Jakarta. Frequently asked questions answered straight from my CV, plus a box that answers anything else in it.">
<!-- a link pasted into LinkedIn or a chat renders from these, not from the page -->
<meta property="og:type" content="website">
<meta property="og:title" content="Anggie Putra Dimasta">
<meta property="og:description" content="Staff Software Engineer in Jakarta. Every answer is a quote from the CV, including the ones I did not write.">
<meta name="twitter:card" content="summary">
<!-- ponytail: no og:image. A 1200x630 banner means cropping a portrait to 1.9:1, which
     frames nobody. Add one when a real asset exists. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* Tokens lifted from hesoyam: apps/web/src/styles/nothing-tokens.css plus the shadcn
     bridge in the same folder's app.css. The comments name the source token, so a re-read
     of those two files maps straight onto this block.

     The part that is easy to miss and that this block used to get wrong: in hesoyam
     --primary is --nd-text-display, and --accent is --nd-surface-raised. Its buttons are
     black-on-white in light mode and white-on-black in dark. Blue is --nd-interactive and
     is only ever a link or a focus ring. So the chrome here is monochrome and there is exactly
     one hue, carrying exactly one meaning. --nd-accent (the red) is deliberately absent: it is
     --destructive in hesoyam, and there is nothing destructive on this page to signal.

     Both border tokens come from hesoyam and they are a deliberate pair, not one value used
     twice: --nd-border for resting outlines, --nd-border-visible for anything the user can
     act on or has opened. --nd-border measures only 1.22:1 against --card, which is faint on
     purpose; the open card and the input step up to the visible token rather than jumping to
     full-contrast text colour, because a hard black outline on a grey card is louder than the
     thing it is highlighting. --interactive is the one darkened value, because #007aff is
     3.7:1 on #f5f5f5 and it has to carry link text here. */
  :root {
    --bg: #f5f5f5;           /* --nd-black */
    --card: #ffffff;         /* --nd-surface */
    --raised: #f0f0f0;       /* --nd-surface-raised */
    --line: #e8e8e8;         /* --nd-border, resting outlines */
    --line-strong: #cccccc;  /* --nd-border-visible, opened cards and fields */
    --fg: #1a1a1a;           /* --nd-text-primary */
    --display: #000000;      /* --nd-text-display, and --primary */
    --muted: #666666;        /* --nd-text-secondary */
    --interactive: #0059b3;  /* --nd-interactive #007aff, darkened for link text */
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111215; --card: #18191e; --raised: #21232a;
      --line: #2b2d36; --line-strong: #3a3d49;
      --fg: #edeef2; --display: #ffffff; --muted: #9ca0af;
      --interactive: #5b9bf6;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 var(--sans);
    font-feature-settings: "kern", "liga";
    text-wrap: pretty;            /* hesoyam sets this on body; it evens out the ragging */
  }
  h1, h2, .summary { text-wrap: balance; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem 2.5rem; }
  header { text-align: center; margin-bottom: 1.75rem; }
  /* square, no radius - object-fit crops whatever aspect ratio the source photo has,
     so a 4:5 portrait and a 16:9 shot both fill the same 96px box */
  .me {
    display: block; width: 6rem; height: 6rem; margin: 0 auto 1rem;
    object-fit: cover; border: 1px solid var(--line); background: var(--raised);
  }
  /* the hero is --nd-text-display, not a hue: hesoyam's nd-hero is the Doto display face in
     --nd-text-display, and the colour is the point, not the gradient. Doto is a webfont and
     this site ships zero third-party requests, so the display role is carried by weight and
     tracking instead. Add @font-face for Doto when a self-hosted copy is worth the bytes. */
  h1 { font-size: 1.9rem; letter-spacing: -0.03em; margin: 0 0 .3rem; font-weight: 700; line-height: 1.05; color: var(--display); }
  /* nd-label in hesoyam: Space Mono, .6875rem, uppercase, .08em, secondary colour. The system
     mono stack is the closest thing to Space Mono without a webfont request. */
  .role { color: var(--muted); margin: 0 0 .8rem; font-family: var(--mono); font-size: .78rem; letter-spacing: .04em; }
  .summary { max-width: 32rem; margin: 0 auto 1rem; text-align: center; }
  .built {
    max-width: 34rem; margin: 0 auto 1.1rem; text-align: center;
    font-size: .85rem; color: var(--muted);
  }
  /* nowrap on the name, because a project name that breaks across lines reads as two
     projects; the separator carries enough weight to survive a wrap, which at opacity .5
     it did not - "component library" and the next name ran together as one phrase. */
  .built b { font-weight: 550; color: var(--display); white-space: nowrap; }
  .built i { font-family: var(--mono); font-style: normal; color: var(--muted); padding: 0 .5em; }
  .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: .88rem; }
  a { color: var(--interactive); text-underline-offset: 2px; }
  a:hover { color: var(--display); }
  .tag {
    display: inline-block; margin-top: .8rem; padding: .15rem .5rem;
    font: inherit; font-size: .76rem; color: var(--muted); background: none;
    border: 1px dashed var(--line); cursor: pointer; user-select: none;
  }
  .tag:hover { border-color: var(--display); color: var(--display); }
  h2 {
    font-family: var(--mono); font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 400; text-align: center;
    margin: 0 0 .6rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
  }

  details.q {
    background: var(--card); border: 1px solid var(--line);
    margin-bottom: .4rem; overflow: hidden;
  }
  details.q[open] { border-color: var(--line-strong); }
  summary {
    cursor: pointer; padding: .7rem .9rem; font-weight: 550; list-style: none;
    display: flex; align-items: center; gap: .6rem;
    color: var(--display);          /* the question is the scan target, so it stays at full */
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; color: var(--muted); font-weight: 400; width: .7rem; flex: none; }
  details[open] > summary::before { content: "\2212"; }
  summary:hover { background: var(--raised); }
  .body { padding: 0 .9rem .8rem; }
  /* The answer is a quotation, not prose written for the visitor, so it is set as a quoted
     block: mono, on the raised surface, inside the card, with a heavier left rule and a dot
     grid behind it. A markdown codeblock is the closest thing the platform already has for
     "this text was not composed here", and that is exactly the claim the site makes. The dot
     grid is hesoyam's own dot-grid utility, at 1px in the border token, so it reads as texture
     rather than pattern. One block per answer: paras() emits bare <p> and quote() wraps them.
     max-width is a guard, not the fix - 23 of 38 chunk bodies are a single 300+ character
     paragraph, and no amount of styling makes that scannable. */
  .quote {
    font-family: var(--mono); font-size: .88rem; line-height: 1.65;
    color: var(--muted);
    background-color: var(--raised);
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 14px 14px;
    border: 1px solid var(--line); border-left: 2px solid var(--line-strong);
    padding: .75rem .85rem; margin: 0 0 .7rem;
    max-width: 68ch;              /* past this a mono line is a wall, not a quotation */
    text-align: left; tab-size: 2;
    overflow-wrap: anywhere;      /* a long URL in a chunk must not widen the column */
  }
  .quote p { margin: 0 0 .85rem; white-space: pre-wrap; }
  .quote p:last-child { margin-bottom: 0; }

  form { display: flex; gap: .4rem; }
  input {
    flex: 1; min-width: 0; padding: .6rem .75rem; font: inherit; font-size: .93rem;
    color: var(--fg); background: var(--raised); border: 1px solid var(--line-strong);
  }
  input::placeholder { color: var(--muted); }
  button {
    padding: .6rem 1rem; font: inherit; font-size: .93rem; font-weight: 550;
    color: var(--bg); background: var(--display); border: 0; cursor: pointer;
  }
  :is(a, input, button, summary, .tag):focus-visible { outline: 2px solid var(--interactive); outline-offset: 2px; }
  /* hesoyam's dropdown-scrollbar utility, transcribed. Thin, transparent track, a pill thumb
     inset by a transparent border so it reads as a lozenge rather than a slab, and hover
     stepping to the text-secondary token. Applied to the page and to both wide-layout
     scrollers, so no scrollbar on this site looks like it came from somewhere else. */
  :is(html, header, .col-faq) {
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  :is(html, header, .col-faq)::-webkit-scrollbar { width: .5rem; height: .5rem; }
  :is(html, header, .col-faq)::-webkit-scrollbar-track { background: transparent; }
  :is(html, header, .col-faq)::-webkit-scrollbar-thumb {
    background-color: var(--line);
    border-radius: 9999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  :is(html, header, .col-faq)::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }

  .alt { color: var(--muted); font-size: .85rem; margin: .9rem 0 0; }
  /* a link that happens to be a button, so it is reachable by keyboard for free */
  .link {
    font: inherit; color: var(--interactive); background: none; border: 0; padding: 0;
    text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
  }
  /* the FAQ items already carry their own margin, this is the gap before the ask box */
  #askhost { margin-top: 1.3rem; }
  #out { margin-top: .7rem; padding-top: .7rem; border-top: 1px solid var(--line); }
  #out:empty { display: none; }
  #out .src { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .4rem; }
  /* #out holds .src, .weak and .quote side by side, so the bare `p` rule it used to have was
     repainting the chrome along with the answer. Every paragraph in here carries a class or is
     a .quote now, so there is nothing left for a type selector to do. */
  .weak { color: var(--muted); font-size: .92rem; }
  .quote p.streaming::after {
    content: "\258C"; color: var(--display); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #out .dots { display: flex; gap: .26rem; margin: 0 0 .7rem; }
  #out .dots i { width: .36rem; height: .36rem; background: var(--muted); animation: hop .9s ease-in-out infinite; }
  #out .dots i:nth-child(2) { animation-delay: .13s; }
  #out .dots i:nth-child(3) { animation-delay: .26s; }
  @keyframes hop {
    0%, 65%, 100% { opacity: .25; transform: none; }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  /* ---- layout overrides, last in the sheet on purpose ----
     Every base rule above is plain `selector { }` with the same specificity as its media
     counterpart, so source order decides. An override written next to the rule it changes
     loses to a base rule further down the file - which is how the header kept a 1.75rem
     bottom margin inside a centred grid cell and sat half a rem high. Grouping the
     overrides here means the base sheet reads top to bottom and can never be half-applied. */
  /* Wide: hero on the left, questions and ask box on the right, and the page itself does not
     scroll. The viewport is the viewport: main is exactly 100vh, the two columns divide it,
     and only the question column scrolls. Nothing on the left can move, so the hero cannot
     drift away from the middle no matter how long the FAQ gets.

     min-height:0 on both columns is load-bearing. Grid items default to min-height:auto, which
     refuses to shrink below their content, so without it overflow-y:auto on .col-faq is
     ignored and the FAQ pushes the page taller instead of scrolling inside it.
     overscroll-behavior:contain stops the FAQ reaching its end and handing the leftover scroll
     to the page, which is what would otherwise re-introduce page scroll from a still gesture. */
  @media (min-width: 64rem) {
    html, body { height: 100%; overflow: hidden; }
    main {
      max-width: 68rem;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "hero faq";
      column-gap: 3.5rem;
      align-items: stretch;
    }
    /* Both columns are middle-aligned, and they can be, because justify-content:safe center
       does the two things at once: it centres the content when it fits the viewport, and falls
       back to flex-start when it does not, instead of clipping the top the way plain `center`
       does. That is the whole reason the FAQ column is a flex column and not a plain block.
       Where `safe` is unsupported the declaration is dropped and it lands on flex-start, which
       is the old behaviour - a graceful failure, not a broken one. */
    header {
      grid-area: hero;
      margin-bottom: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      /* only scrolls if the hero genuinely does not fit a short window, so the contact links
         are never unreachable. Normally there is nothing to scroll. */
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .col-faq {
      grid-area: faq;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: safe center;   /* middle when it fits, flex-start when it overflows */
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: .5rem;   /* keeps the text off the scrollbar track */
    }
    /* flex children default to shrinking, which would squash the questions on a short window
       instead of letting the column scroll. Pin them to their content height. */
    .col-faq > * { flex: none; }
    /* the rule exists to separate the FAQ from the hero, and here it is beside it */
    .col-faq > h2 { padding-top: 0; border-top: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    details[open] .body { animation: fade .16s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(-3px); } }
  }
</style>
</head>
<body>
<!--
  Nothing here is generated. Every answer is a quote from data/cv.json,
  which you can open right now at ./data/cv.json — that is the whole site.
  Minifying this file would hide nothing and cost a build step, so it stays readable.

  +----------------------------------------------------------+
  |  every answer on this page is a quote from data/cv.json  |
  |  nothing here was generated, so nothing can be invented  |
  +----------------------------------------------------------+
-->
<main>
  <header>
    <img class="me" src="anggiedimasta.jpg" width="96" height="96" alt="Anggie Putra Dimasta" decoding="async" onerror="this.remove()">
    <h1 id="name">&nbsp;</h1>
    <p class="role" id="role"></p>
    <p class="summary" id="summary"></p>
    <p class="built" id="built"></p>
    <nav class="links" id="links"></nav>
    <p><button type="button" class="tag" id="tag">answers are quotes, not generated</button></p>
  </header>

  <section class="col-faq">
    <h2>Frequently asked</h2>
    <div id="faq"></div>
    <div id="askhost"></div>
  </section>
</main>

<noscript>
  <p style="max-width:42rem;margin:0 auto;padding:0 1.25rem 2rem;text-align:left">
    This page builds itself in JavaScript, so without it you get nothing but the title.
    The content does not need a browser: it is one static file,
    <a href="./data/cv.json">data/cv.json</a>. There is also
    <a href="./llms.txt">llms.txt</a>, written for agents.
  </p>
</noscript>

<script type="module">
import { buildIndex, search } from "./search.mjs";

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// a blank line in a chunk body becomes a paragraph break
// a blank line in a chunk body becomes a paragraph break. The class is what marks a paragraph
// as quoted text rather than chrome, which is why it lives here and not in a `p` selector:
// #out holds .src and .weak next to the answer, and a bare `p` rule paints all three.
// A blank line in a chunk body becomes a paragraph break. paras() emits bare <p> and quote()
// wraps them, so one answer is one quoted block however many paragraphs it has - a border per
// paragraph would chop a single quotation into several and read as several separate claims.
const paras = (t) => String(t).trim().split(/\n{2,}/).map((x) => `<p>${esc(x.trim())}</p>`).join("");
const quote = (inner) => `<div class="quote">${inner}</div>`;
const $ = (id) => document.getElementById(id);
let idx = null, cv = null;

const item = (title, inner, open) => `<details class="q"${open ? " open" : ""}><summary>${esc(title)}</summary><div class="body">${inner}</div></details>`;

function renderFeatured() {
  $("faq").innerHTML = cv.featured.map((id) => cv.chunks.find((c) => c.id === id))
    .filter(Boolean).map((c) => item(c.title, quote(paras(c.body)))).join("");

  // the sixth item: same accordion, but it asks instead of telling
  $("askhost").innerHTML = item("Ask me anything",
    `<form id="ask" autocomplete="off">
       <input id="q" name="q" type="search" placeholder="Do you do backend, or only frontend?" required>
       <button type="submit">Ask</button>
     </form>
     <div id="out" role="status" aria-live="polite"></div>
     <p class="alt">Not finding it? <button type="button" class="link" id="copy">Copy the whole CV for an AI</button></p>`, true);
}

function ask(q) {
  const hits = search(idx, q, 3);
  // No trailing contact block here. The header already carries the email, and repeating it
  // under every answer made the output read like a form letter.
  if (!hits.length) return { text: "That isn't in my CV, so I won't invent one.", html: `<p>That isn't in my CV, so I won't invent one.</p>` };
  const [top, ...rest] = hits;
  const also = rest.length ? `<p class="weak">Also close: ${rest.map((r) => esc(r.chunk.title)).join(" · ")}</p>` : "";
  const weak = top.confident ? "" : `<p class="weak">Might not be what you asked — this was the closest thing in my CV.</p>`;
  return {
    text: top.chunk.body,
    html: `<p class="src">From: ${esc(top.chunk.title)}</p>${weak}${quote(paras(top.chunk.body))}${also}`,
  };
}

// Types the answer out, then lands the markup. Plain text during the stream so we
// never parse half-written HTML, and aria-busy so a screen reader waits for the
// final string instead of announcing every fragment.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
// A flat 10ms per character reads as a teletype, not a chat. Real streaming lands in uneven
// bursts, so spaces and punctuation get a beat. No scheduler needed - just look up the
// character we just emitted and sleep for its gap.
const GAP = { " ": 22, ",": 64, ".": 78, ";": 70, ":": 70, "!": 70, "?": 78, "—": 90, "\n": 90 };
let stream = 0;
function streamOut(el, r) {
  const id = ++stream;
  clearTimeout(el._t);
  if (REDUCED.matches) { el.innerHTML = r.html; return; }
  el.setAttribute("aria-busy", "true");

  const dots = document.createElement("p");
  dots.className = "dots";
  dots.append(...Array.from({ length: 3 }, () => document.createElement("i")));

  const box = document.createElement("div");
  box.className = "quote";
  const p = document.createElement("p");
  p.className = "streaming";
  box.append(p);

  el.replaceChildren(dots);
  let i = 0;
  const type = () => {
    if (id !== stream) return;            // a newer question superseded this one
    p.textContent = r.text.slice(0, i + 1);
    const ch = r.text[i++];
    if (i < r.text.length) el._t = setTimeout(type, GAP[ch] ?? 8);
    else { el.innerHTML = r.html; el.removeAttribute("aria-busy"); }
  };
  el._t = setTimeout(() => {
    if (id !== stream) return;
    el.replaceChildren(box);
    type();
  }, 420);
}

// ---- easter eggs: only visible if you go looking for them ----
// Same banner as the comment at the top of this file, so the two copies are the same
// string. A second source of truth for one joke is the correct amount of duplication.
const ART = `+----------------------------------------------------------+
|  every answer on this page is a quote from data/cv.json  |
|  nothing here was generated, so nothing can be invented  |
+----------------------------------------------------------+`;

const TAGS = [
  "answers are quotes, not generated",
  "0 model calls. 0 API keys. 0 cost.",
  "you found the easter egg",
  "the scorer is BM25, and that is the whole trick",
  "nothing here was invented by an LLM",
  "back to the start",
];
let ti = 0;
function cycleTag() { ti = (ti + 1) % TAGS.length; $("tag").textContent = TAGS[ti]; }
$("tag").addEventListener("click", cycleTag);

fetch("./data/cv.json")
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => {
    cv = d;
    idx = buildIndex(cv.chunks);
    $("name").textContent = cv.name;
    $("role").textContent = `${cv.title} · ${cv.location}`;
    $("summary").textContent = cv.summary;
    if (cv.projects?.length) {
      $("built").innerHTML = "Things I have built: " + cv.projects
        .map((p) => `<b>${esc(p.name)}</b><i>/</i>${esc(p.note)}`)
        .join(" ");
    }
    $("links").innerHTML =
      `<a href="${esc(cv.links.github)}">GitHub</a><a href="${esc(cv.links.linkedin)}">LinkedIn</a>` +
      `<a href="mailto:${esc(cv.email)}">${esc(cv.email)}</a>` +
      (cv.phone ? `<a href="tel:${esc(cv.phone.replace(/[^\d+]/g, ""))}">${esc(cv.phone)}</a>` : "");
    renderFeatured();

    $("ask").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = $("q").value.trim();
      if (v) streamOut($("out"), ask(v));
    });

    // Hands the visitor the corpus in a form any chat window accepts. Built from the cv we
    // already loaded, so there is no second copy to keep in sync and nothing to fetch.
    $("copy").addEventListener("click", async () => {
      // Escaping would be wrong here: this goes to the clipboard as text for a model to
      // read, so HTML entities would land in the CV the model quotes back.
      const head = `# ${cv.name} — ${cv.title} (${cv.location})\n\n${cv.summary}`; // plaintext, not html
      const md = cv.chunks.map((c) => `## ${c.title}\n\n${c.body}`).join("\n\n"); // plaintext, not html
      try {
        await navigator.clipboard.writeText(
          "Answer only from the CV below, and quote it rather than paraphrasing into claims " +
          `the CV does not make. If the answer is not in there, say so.\n\n${head}\n\n${md}`);
        $("copy").textContent = "Copied. Paste it into any AI.";
      } catch {
        $("copy").textContent = "Clipboard blocked — the CV is at ./data/cv.json";
      }
    });

    // The native clear "x" on <input type="search"> fires an input event, not a submit, so
    // the answer would sit there under an empty box. Bump the stream counter to kill typing
    // still in flight, then empty the answer.
    $("q").addEventListener("input", (e) => {
      if (e.target.value) return;
      stream++;
      clearTimeout($("out")._t);
      $("out").replaceChildren();
    });

    console.log("%c answered from my CV, not generated ", "background:#2f5bd7;color:#fff;padding:2px 6px;border-radius:3px");
    console.log("%c " + cv.chunks.length + " chunks · BM25 in your browser · no server, no model, no bill.\n" +
      "The whole site is data/cv.json — open it in another tab.", "color:#888");
    console.log(ART);
    console.log("P.S. the dashed pill under my name has more than one line.");
  })
  .catch((err) => {
    $("askhost").innerHTML = item("Could not load the CV",
      `<p>fetch of <code>data/cv.json</code> failed (${esc(err.message)}).</p>
       <p class="weak">Open this over HTTP — <code>python -m http.server</code> here — not as a <code>file://</code> URL.</p>`);
  });
</script>
</body>
